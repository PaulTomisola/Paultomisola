<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elsewhere — Paul Tomisola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17140F;
    --text: #EDEAE2;
    --muted: #9C9A92;
    --rule: rgba(255,255,255,0.16);
    --accent: #D9A441;
    --max-w: 760px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.65;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  a{color:inherit;}
  .wrap{max-width:var(--max-w); margin:0 auto; padding:0 28px;}
  .label{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);}

  header{padding:28px 0;}
  header .wrap{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  .brand{font-family:'Lora', Georgia, serif; font-size:15px; letter-spacing:0.14em; text-transform:uppercase;}
  nav{display:flex; gap:26px;}
  nav a{
    position:relative; font-size:14.5px; text-decoration:none; color:var(--muted);
    transition:color .3s cubic-bezier(.4,0,.2,1); padding-bottom:3px;
  }
  nav a::after{
    content:''; position:absolute; left:0; bottom:0; width:100%; height:1px;
    background:var(--accent); transform:scaleX(0); transform-origin:right;
    transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  nav a:hover::after, nav a:focus-visible::after{transform:scaleX(1); transform-origin:left;}
  nav a.current{color:var(--text);}
  nav a:hover, nav a:focus-visible{color:var(--text);}

  hr.rule{border:none; border-top:1px solid var(--rule); margin:0;}

  .intro{padding:52px 0 8px;}
  .intro h1{font-family:'Lora', Georgia, serif; font-weight:440; font-size:clamp(28px, 5vw, 40px); line-height:1.15; margin:0 0 14px;}
  .intro p{font-size:14.5px; color:#C9C6BC; max-width:56ch; margin:0 0 28px;}

  .list{padding:8px 0 60px;}
  .item{display:flex; align-items:baseline; justify-content:space-between; gap:14px; text-decoration:none; padding:22px 0; transition:padding-left .3s cubic-bezier(.4,0,.2,1);}
  .item:hover{padding-left:6px;}
  .item + .item{border-top:1px solid var(--rule);}
  .item-title{font-family:'Lora', Georgia, serif; font-size:20px; font-weight:440; color:var(--text); margin:0 0 4px; transition:color .2s ease;}
  .item:hover .item-title, .item:focus-visible .item-title{color:var(--accent);}
  .item-desc{font-size:13.5px; color:var(--muted); margin:0;}
  .item-arrow{font-size:14px; color:var(--muted); transition:transform .3s cubic-bezier(.4,0,.2,1), color .3s cubic-bezier(.4,0,.2,1);}
  .item:hover .item-arrow, .item:focus-visible .item-arrow{transform:translateX(3px); color:var(--accent);}

  footer{padding:24px 0 40px;}
  footer .wrap{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}

  @media (max-width:600px){
    .wrap{padding:0 22px;}
    header{padding:22px 0;}
    nav{gap:18px;}
    .intro{padding:36px 0 8px;}
    .item{padding:30px 0;}
  }

  .reveal{opacity:0; transform:translateY(14px); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);}
  .reveal.in-view{opacity:1; transform:translateY(0);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">Paul Tomisola</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="writings.html">Writing</a>
      <a href="elsewhere.html" class="current">Elsewhere</a>
    </nav>
  </div>
</header>
<hr class="rule">

<section class="intro wrap reveal">
  <h1>Elsewhere</h1>
  <p>Where else to find me — thoughts, reels, and the rest. 🦉</p>
</section>
<hr class="rule">

<section class="list wrap reveal">
  <a class="item" href="https://medium.com/@paultomisola" target="_blank" rel="noopener">
    <span><p class="item-title">Medium</p><p class="item-desc">Published essays, football writing, and musings.</p></span>
    <span class="item-arrow">→</span>
  </a>
  <a class="item" href="https://www.instagram.com/bytomisola/" target="_blank" rel="noopener">
    <span><p class="item-title">Instagram</p><p class="item-desc">Video essays and reels.</p></span>
    <span class="item-arrow">→</span>
  </a>
  <a class="item" href="https://x.com/writenstein" target="_blank" rel="noopener">
    <span><p class="item-title">X</p><p class="item-desc">Shorter thoughts, in real time.</p></span>
    <span class="item-arrow">→</span>
  </a>
</section>

<hr class="rule">
<footer>
  <div class="wrap">
    <span class="label">Lagos, Nigeria</span>
    <span class="label">© 2026 Paul Tomisola</span>
  </div>
</footer>

<script>
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
</script>
</body>
</html>
